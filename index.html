<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ShopSphere Pro Max</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}
:root{
--bg:#eef1f5;
--card:#ffffff;
--text:#111;
--primary:#ff6b35;
--secondary:#004e89;
--accent:#f7b801;
}
body.dark{
--bg:#0a0e27;
--card:#1a1f3a;
--text:#f0f0f0;
}
body{
background:var(--bg);
color:var(--text);
transition:0.3s;
}
/* NAVBAR */
.navbar{
background:linear-gradient(135deg,#004e89,#1a237e);
padding:15px 20px;
display:flex;
align-items:center;
gap:15px;
color:white;
position:sticky;
top:0;
z-index:100;
box-shadow:0 4px 10px rgba(0,0,0,0.2);
}
.logo{
font-size:28px;
font-weight:bold;
color:var(--accent);
}
.search{
flex:1;
}
.search input{
width:100%;
padding:12px 18px;
border:none;
border-radius:30px;
font-size:15px;
outline:none;
}
.navbar button{
border:none;
padding:10px 15px;
border-radius:8px;
cursor:pointer;
font-weight:bold;
transition:0.3s;
}
.theme-btn{
background:var(--primary);
color:white;
}
.login-btn-nav{
background:var(--accent);
color:#000;
}
/* CATEGORY */
.catbar{
display:flex;
gap:10px;
overflow-x:auto;
padding:15px;
background:white;
box-shadow:0 2px 5px rgba(0,0,0,0.08);
}
.catbar button{
border:none;
padding:10px 18px;
border-radius:25px;
background:#f1f1f1;
cursor:pointer;
font-weight:600;
transition:0.3s;
white-space:nowrap;
}
.catbar button:hover{
background:var(--primary);
color:white;
}
/* MAIN LAYOUT */
.container{
display:flex;
gap:20px;
padding:20px;
}
.main{
flex:1;
}
.side{
width:300px;
background:var(--card);
padding:20px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
height:fit-content;
position:sticky;
top:90px;
}
.side h3{
margin-bottom:15px;
color:var(--secondary);
border-bottom:2px solid var(--primary);
padding-bottom:8px;
}
/* PRODUCTS */
.products{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
gap:20px;
margin-bottom:30px;
}
.card{
background:var(--card);
border-radius:18px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
transition:0.3s;
border:1px solid #ddd;
}
.card:hover{
transform:translateY(-6px);
}
.card img{
width:100%;
height:220px;
object-fit:cover;
display:block;
}
.card-content{
padding:15px;
}
.name{
font-weight:bold;
font-size:16px;
margin-bottom:8px;
min-height:45px;
}
.price{
font-size:20px;
font-weight:bold;
color:var(--primary);
margin-bottom:12px;
}
.card button{
width:100%;
padding:10px;
margin-top:8px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
transition:0.3s;
}
.add{
background:var(--accent);
}
.add:hover{
background:#e0a800;
}
.wish{
background:#ffb3ba;
}
.wish:hover{
background:#ff9ca6;
}
.view{
background:var(--primary);
color:white;
}
.view:hover{
background:#e45c2d;
}
/* DETAIL MODAL */
.detail{
position:fixed;
inset:0;
background:rgba(0,0,0,0.8);
display:none;
justify-content:center;
align-items:center;
z-index:999;
}
.detail-box{
background:var(--card);
padding:25px;
border-radius:20px;
width:400px;
text-align:center;
animation:popup 0.3s;
}
@keyframes popup{
from{
transform:scale(0.8);
opacity:0;
}
to{
transform:scale(1);
opacity:1;
}
}
.detail-box img{
width:100%;
height:250px;
object-fit:cover;
border-radius:12px;
margin-bottom:15px;
}
.detail-box h2{
margin-bottom:10px;
}
.detail-box p{
margin-bottom:10px;
}
.detail-box button{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:linear-gradient(135deg,var(--primary),var(--accent));
color:white;
font-weight:bold;
cursor:pointer;
}
.place-order-btn{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:linear-gradient(135deg,var(--accent),var(--primary));
color:#000;
font-weight:700;
cursor:pointer;
margin-top:15px;
transition:0.3s;
}
.place-order-btn:hover{
background:linear-gradient(135deg,#f7b801,#ff6b35);
}
.payment-modal{
position:fixed;
inset:0;
display:none;
justify-content:center;
align-items:center;
background:rgba(0,0,0,0.75);
z-index:1001;
}
.payment-box{
width:90%;
max-width:520px;
background:var(--card);
padding:30px;
border-radius:20px;
box-shadow:0 20px 50px rgba(0,0,0,0.25);
}
.payment-box h2{
margin-bottom:18px;
color:var(--secondary);
}
.payment-box .form-group{
margin-bottom:16px;
}
.payment-box .form-group label{
display:block;
margin-bottom:8px;
font-weight:600;
}
.payment-box .form-group input,
.payment-box .form-group select{
width:100%;
padding:12px;
border:2px solid #ddd;
border-radius:12px;
font-size:15px;
outline:none;
}
.payment-box .form-group input:focus,
.payment-box .form-group select:focus{
border-color:var(--primary);
}
.payment-box .payment-actions{
display:flex;
gap:12px;
margin-top:20px;
}
.payment-box .payment-actions button{
flex:1;
padding:14px;
border:none;
border-radius:12px;
font-weight:700;
cursor:pointer;
}
.payment-box .confirm-btn{
background:linear-gradient(135deg,var(--primary),var(--accent));
color:white;
}
.payment-box .close-btn{
background:#f1f1f1;
color:#333;
}
.payment-message{
margin-top:14px;
font-size:14px;
color:#444;
}
/* LOGIN MODAL */
.modal{
position:fixed;
inset:0;
display:none;
justify-content:center;
align-items:center;
background:rgba(0,0,0,0.8);
z-index:1000;
}
.login-container{
background:white;
width:90%;
max-width:850px;
display:flex;
border-radius:20px;
overflow:hidden;
animation:popup 0.4s;
}
.login-left{
width:45%;
background:linear-gradient(135deg,#004e89,#1a237e);
color:white;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:40px;
text-align:center;
}
.login-left h1{
font-size:38px;
margin-top:15px;
}
.login-left p{
margin-top:10px;
opacity:0.9;
}
.login-right{
width:55%;
padding:40px;
}
.login-right h2{
margin-bottom:20px;
color:var(--secondary);
}
.form-group{
margin-bottom:18px;
}
.form-group label{
display:block;
margin-bottom:6px;
font-weight:bold;
}
.form-group input{
width:100%;
padding:12px;
border:2px solid #ddd;
border-radius:10px;
outline:none;
}
.form-group input:focus{
border-color:var(--primary);
}
.login-submit{
width:100%;
padding:13px;
border:none;
border-radius:10px;
background:linear-gradient(135deg,var(--primary),var(--accent));
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
}
.toggle{
text-align:center;
margin-top:15px;
}
.toggle a{
color:var(--primary);
cursor:pointer;
font-weight:bold;
}
/* RESPONSIVE */
@media(max-width:768px){
.container{
flex-direction:column;
}
.side{
width:100%;
position:static;
}
.login-container{
flex-direction:column;
}
.login-left,
.login-right{
width:100%;
}
.products{
grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
}
.card img{
height:180px;
}
}
</style>
</head>
<body>
<!-- LOGIN MODAL -->
<div class="modal" id="loginModal">
<div class="login-container">
<div class="login-left">
<div style="font-size:80px;">🛍️</div>
<h1>ShopSphere</h1>
<p>Best Online Shopping Experience</p>
</div>
<div class="login-right">
<div id="loginForm">
<h2>Login</h2>
<div class="form-group">
<label>Email</label>
<input type="text" id="loginEmail" placeholder="Enter email">
</div>
<div class="form-group">
<label>Password</label>
<input type="password" id="loginPassword" placeholder="Enter password">
</div>
<button class="login-submit" onclick="login()">Sign In</button>
<div class="toggle">
Don't have an account?
<a onclick="toggleForm()">Create Account</a>
</div>
</div>
<div id="signupForm" style="display:none;">
<h2>Create Account</h2>
<div class="form-group">
<label>Full Name</label>
<input type="text" id="signupName" placeholder="Enter name">
</div>
<div class="form-group">
<label>Email</label>
<input type="email" id="signupEmail" placeholder="Enter email">
</div>
<div class="form-group">
<label>Password</label>
<input type="password" id="signupPass" placeholder="Create password">
</div>
<button class="login-submit" onclick="signup()">Create Account</button>
<div class="toggle">
Already have account?
<a onclick="toggleForm()">Login</a>
</div>
</div>
</div>
</div>
</div>
<!-- NAVBAR -->
<div class="navbar">
<div class="logo">🛒 ShopSphere</div>
<div class="search">
<input type="text" placeholder="Search products..." onkeyup="search(this.value)">
</div>
<button class="theme-btn" onclick="toggleDark()">🌙 Theme</button>
<button class="login-btn-nav" id="userBtn" onclick="logout()">Login</button>
</div>
<!-- CATEGORY -->
<div class="catbar">
<button onclick="render(data)">All</button>
<button onclick="filterCat('Electronics')">Electronics</button>
<button onclick="filterCat('Men')">Men</button>
<button onclick="filterCat('Women')">Women</button>
<button onclick="filterCat('Home')">Home</button>
<button onclick="filterCat('Sports')">Sports</button>
</div>
<!-- MAIN -->
<div class="container">
<div class="main" id="main"></div>
<div class="side">
<h3>🛒 Cart</h3>
<div id="cart">Cart Empty</div>
<h3 style="margin-top:25px;">❤️ Wishlist</h3>
<div id="wish">No Wishlist Items</div>
<h3 style="margin-top:25px;">💰 Total</h3>
<div id="total">₹0</div>
<button class="place-order-btn" id="placeOrderBtn" onclick="openPayment()">Place Order</button>
<div class="payment-message" id="paymentMessage">Add items to cart to checkout.</div>
</div>
</div>
<!-- DETAIL MODAL -->
<div class="detail" id="detail">
<div class="detail-box" id="detailBox"></div>
</div>
<div class="payment-modal" id="paymentModal">
<div class="payment-box">
<h2>Payment Details</h2>
<div class="form-group">
<label>Name on Card</label>
<input type="text" id="cardName" placeholder="Full name as on card">
</div>
<div class="form-group">
<label>Card Number</label>
<input type="text" id="cardNumber" placeholder="1234 5678 9012 3456" maxlength="19">
</div>
<div class="form-group">
<label>Expiry Date</label>
<input type="text" id="cardExpiry" placeholder="MM/YY" maxlength="5">
</div>
<div class="form-group">
<label>CVV</label>
<input type="password" id="cardCvv" placeholder="123" maxlength="4">
</div>
<div class="payment-actions">
<button class="confirm-btn" onclick="submitPayment()">Pay ₹0</button>
<button class="close-btn" onclick="closePayment()">Cancel</button>
</div>
</div>
</div>
<script>
/* PRODUCT IMAGES */

"Sports Water Bottle":"https://images.unsplash.com/photo-1602143407151-7111542de6e8?w=600",
"Running Treadmill":"https://images.unsplash.com/photo-1518611012118-696072aa579a?w=600"
};

function isValidImageUrl(url){
return typeof url === "string" && /^https?:\/\//i.test(url.trim());
}
function normalizeImageKey(value){
return String(value || "")
.replace(/\\"/g, '"')
.trim()
.toLowerCase();
}

function getProductImageUrl(name){
const direct = productImages[name];
if(isValidImageUrl(direct)) return direct;

const normalizedName = normalizeImageKey(name);
for(const [key, value] of Object.entries(productImages)){
if(normalizeImageKey(key) === normalizedName && isValidImageUrl(value)){
return value;
}
}
return null;
}
/* PRODUCTS */
const data={
Electronics:[
{id:1,name:"MacBook Pro 16 M2",price:120000},
{id:2,name:"iPhone 15 Pro Max",price:80000},
{id:3,name:"Samsung 55\" 4K TV",price:45000},

],

],

Women:[

{id:28,name:"Running Shoes",price:3000},

],

Home:[

{id:40,name:"Ceramic Table Lamp",price:3500},
{id:41,name:"Aroma Diffuser",price:1800},
{id:42,name:"Kitchen Blender",price:2200},
{id:43,name:"Coffee Maker",price:3000},
{id:44,name:"Dining Table Set",price:18000}
],

Sports:[
{id:45,name:"Soccer Ball Professional",price:1200},
{id:46,name:"Yoga Mat",price:900},
{id:48,name:"Fitness Dumbbells",price:1800},
{id:49,name:"Cycling Helmet",price:2100},
{id:50,name:"Sports Water Bottle",price:450},
]
};
/* APPLY IMAGES */
const imageMismatchProducts = new Set(["Satin Scarf"]);

Object.keys(data).forEach(category=>{
data[category] = data[category].filter(product=>{
if(imageMismatchProducts.has(product.name)){
return false;
}
const imageUrl = getProductImageUrl(product.name);
if(!isValidImageUrl(imageUrl)){
return false;
}
product.img = imageUrl;
return true;
});
});
/* STATE */
let user=localStorage.user || "";
let cart=JSON.parse(localStorage.cart || "[]");
let wish=JSON.parse(localStorage.wish || "[]");
/* ELEMENTS */
const main=document.getElementById("main");
const cartDiv=document.getElementById("cart");
const wishDiv=document.getElementById("wish");
const totalDiv=document.getElementById("total");
const detail=document.getElementById("detail");
const detailBox=document.getElementById("detailBox");
const userBtn=document.getElementById("userBtn");
/* LOGIN */
if(!user){
document.getElementById("loginModal").style.display="flex";
}else{
userBtn.innerText=user+" ✓";
}
function toggleForm(){
const login=document.getElementById("loginForm");
const signup=document.getElementById("signupForm");
if(login.style.display==="none"){
login.style.display="block";
signup.style.display="none";
}else{
login.style.display="none";
signup.style.display="block";
}
}
function login(){
const email=document.getElementById("loginEmail").value;
if(!email){
alert("Enter email");
return;
}
localStorage.user=email;
location.reload();
}
function signup(){
const name=document.getElementById("signupName").value;
if(!name){
alert("Enter name");
return;
}
localStorage.user=name;
location.reload();
}
function logout(){
localStorage.removeItem("user");
location.reload();
}
/* DARK MODE */
function toggleDark(){
document.body.classList.toggle("dark");
localStorage.theme=
document.body.classList.contains("dark")
?"dark":"light";
}
/* RENDER */
function render(obj=data){
let html="";
for(let category in obj){
html+=`
<h2 style="margin-bottom:20px;color:var(--secondary);">
${category}
</h2>
<div class="products">
`
i=obj[category].forEach(product=>{
html+=`
<div class="card">
<img src="${product.img}"
alt="${product.name}"
loading="lazy"
decoding="async"
referrerpolicy="no-referrer"
onerror="this.closest('.card').remove()">
<div class="card-content">
<div class="name">${product.name}</div>
<div class="price">₹${product.price}</div>
<button class="add" onclick="add(${product.id})">
Add to Cart
</button>

<button class="wish" onclick="addWish(${product.id})">
Wishlist
</button>

<button class="view" onclick="viewProduct(${product.id})">
View
</button>
</div>
</div>

`;
});
html+="</div>";
}
main.innerHTML=html;
}
/* FILTER */
function filterCat(category){
let filtered={};
filtered[category]=data[category];
render(filtered);
}
/* ADD TO CART */
function add(id){
for(let category in data){
let product=data[category].find(p=>p.id===id);
if(product){
cart.push(product);
}
}
update();
alert("Added to Cart");
}
/* WISHLIST */
function addWish(id){
for(let category in data){
let product=data[category].find(p=>p.id===id);
if(product && !wish.find(w=>w.id===id)){
wish.push(product);
}
}
update();
alert("Added to Wishlist");
}
/* VIEW PRODUCT */
function viewProduct(id){
for(let category in data){
let product=data[category].find(p=>p.id===id);
if(product){
detailBox.innerHTML=`
<img src="${product.img}">
<h2>${product.name}</h2>
<p class="price">₹${product.price}</p>
<p>Premium quality product from ShopSphere</p>
<button onclick="add(${product.id})">
Add to Cart
</button>
`;
detail.style.display="flex";
}
}
}
detail.onclick=()=>{
detail.style.display="none";
};

function openPayment(){
if(!cart.length){
alert("Your cart is empty. Add items before placing an order.");
return;
}
const total=cart.reduce((sum,item)=>sum+item.price,0);
document.querySelector(".confirm-btn").innerText=`Pay ₹${total}`;
document.getElementById("paymentModal").style.display="flex";
}

function closePayment(){
    document.getElementById("paymentModal").style.display="none";
}
function submitPayment(){
const name=document.getElementById("cardName").value.trim();
const number=document.getElementById("cardNumber").value.replace(/\s+/g,"");
const expiry=document.getElementById("cardExpiry").value.trim();
const cvv=document.getElementById("cardCvv").value.trim();
if(!name||!number||!expiry||!cvv){
alert("Please fill all payment details.");
return;
}
if(number.length < 12 || !/^\d+$/.test(number)){
alert("Enter a valid card number.");
return;
}
if(!/^(0[1-9]|1[0-2])\/(\d{2})$/.test(expiry)){
alert("Enter expiry in MM/YY format.");
return;
}
if(cvv.length < 3 || cvv.length > 4 || !/^\d+$/.test(cvv)){
alert("Enter a valid CVV.");
return;
}
const total=cart.reduce((sum,item)=>sum+item.price,0);
const items=cart.map(item=>item.name).join(", ");
alert(`Order placed successfully!\nTotal Paid: ₹${total}\nItems: ${items}`);
cart=[];
localStorage.cart=JSON.stringify(cart);
update();
closePayment();
document.getElementById("cardName").value="";
document.getElementById("cardNumber").value="";
document.getElementById("cardExpiry").value="";
document.getElementById("cardCvv").value="";
}
/* UPDATE */
function update(){
localStorage.cart=JSON.stringify(cart);
localStorage.wish=JSON.stringify(wish);

cartDiv.innerHTML=
cart.length
?cart.map(i=>`${i.name} - ₹${i.price}`).join("<br>")
:"Cart Empty";

wishDiv.innerHTML=
wish.length
?wish.map(i=>i.name).join("<br>")
:"No Wishlist Items";

const total=cart.reduce((a,b)=>a+b.price,0);
totalDiv.innerHTML="₹"+total;

const orderBtn=document.getElementById("placeOrderBtn");
if(orderBtn){
orderBtn.disabled = cart.length === 0;
orderBtn.style.opacity = cart.length === 0 ? 0.7 : 1;
}
document.getElementById("paymentMessage").innerText=
cart.length
?`Ready to checkout ${cart.length} item${cart.length>1?"s":""}.`:
"Add items to cart to checkout.";
}
/* SEARCH */
function search(text){
text=text.toLowerCase();
let filtered={};
for(let category in data){
let items=data[category].filter(product=>
product.name.toLowerCase().includes(text)
);
if(items.length){
filtered[category]=items;
}
}
render(filtered);
}
/* INIT */
if(localStorage.theme==="dark"){
document.body.classList.add("dark");
}
render();
update();
</script>
</body>
</html>
